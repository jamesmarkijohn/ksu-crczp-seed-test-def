---
- name: Configure Ubuntu desktop + Guacamole-compatible XVNC (port 5900) via XDMCP
  hosts: ubuntu-desktop
  become: true

  vars:
    mgmt_user: ubuntu
    xvnc_geometry: "1280x720"
    xvnc_security_types: "None"
    lightdm_xdmcp_conf: "/etc/lightdm/lightdm.conf.d/50-xdmcp.conf"

  handlers:
    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart lightdm
      ansible.builtin.service:
        name: lightdm
        state: restarted

    - name: restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Install desktop + display manager + Xorg + TigerVNC (Xvnc)
      ansible.builtin.apt:
        update_cache: true
        name:
          - xfce4
          - xfce4-goodies
          - dbus-x11
          - lightdm
          - lightdm-gtk-greeter
          - xserver-xorg-core
          - xserver-xorg-video-all
          - xserver-xorg-input-all
          - xinit
          - tigervnc-standalone-server
          - tigervnc-common
          - openssh-server
          - firefox
        state: present

    - name: Ensure ssh service is running
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Ensure bootstrap SSH user exists (CRCZP key-based access)
      ansible.builtin.user:
        name: user
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: Allow CRCZP-generated SSH public key for bootstrap user
      ansible.builtin.authorized_key:
        user: user
        state: present
        key: "{{ lookup('file', global_ssh_public_user_key) }}"

    - name: Allow passwordless sudo for bootstrap user (no password set)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-crczp-bootstrap-user
        owner: root
        group: root
        mode: "0440"
        content: |
          user ALL=(ALL) NOPASSWD:ALL

    - name: Disable password-based SSH authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-crczp-keyonly.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
      notify: restart ssh

    - name: Lock password login for default accounts (no default credentials)
      ansible.builtin.user:
        name: "{{ mgmt_user }}"
        password_lock: true

    - name: Ensure LightDM is the default display manager
      ansible.builtin.copy:
        dest: /etc/X11/default-display-manager
        mode: "0644"
        content: "/usr/sbin/lightdm\n"
      notify: restart lightdm

    - name: Enable XDMCP in LightDM (needed for Xvnc -query localhost)
      ansible.builtin.copy:
        dest: "{{ lightdm_xdmcp_conf }}"
        mode: "0644"
        content: |
          [XDMCPServer]
          enabled=true
          port=177

          [Seat:*]
          user-session=xfce
      notify: restart lightdm

    - name: Stop and disable TigerVNC vncserver@ services if present
      ansible.builtin.systemd:
        name: "vncserver@1.service"
        enabled: false
        state: stopped
      ignore_errors: true

    - name: Mask TigerVNC vncserver@ template to prevent it coming back
      ansible.builtin.command: systemctl mask vncserver@.service
      changed_when: false
      failed_when: false

    - name: Disable any leftover socat forwarder service if present
      ansible.builtin.systemd:
        name: vnc5900-forward.service
        enabled: false
        state: stopped
      ignore_errors: true

    - name: Kill any stray socat listener on TCP/5900 (best-effort)
      ansible.builtin.shell: |
        set -e
        pids="$(ss -lntp '( sport = :5900 )' 2>/dev/null | awk -F'pid=|,' '/pid=/ {print $2}' | sort -u)"
        if [ -n "$pids" ]; then
          kill $pids || true
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Write xvnc.socket (systemd socket activation on port 5900)
      ansible.builtin.copy:
        dest: /etc/systemd/system/xvnc.socket
        mode: "0644"
        content: |
          [Unit]
          Description=XVNC Server on port 5900

          [Socket]
          ListenStream=5900
          Accept=yes

          [Install]
          WantedBy=sockets.target
      notify: daemon reload

    - name: Write xvnc@.service (spawn Xvnc per connection via inetd mode)
      ansible.builtin.copy:
        dest: /etc/systemd/system/xvnc@.service
        mode: "0644"
        content: |
          [Unit]
          Description=Daemon for each XVNC connection

          [Service]
          ExecStart=-/usr/bin/Xvnc -inetd -query localhost -geometry {{ xvnc_geometry }} -once -SecurityTypes={{ xvnc_security_types }}
          User=nobody
          StandardInput=socket
          StandardError=journal
      notify: daemon reload

    - name: Ensure LightDM is running (provides XDMCP on UDP/177)
      ansible.builtin.service:
        name: lightdm
        state: started
        enabled: false
      ignore_errors: false

    - name: Enable and start xvnc.socket
      ansible.builtin.systemd:
        name: xvnc.socket
        enabled: true
        state: started

    - name: Show listening state (debug)
      ansible.builtin.shell: |
        set -e
        echo "=== TCP listeners (5900/5901) ==="
        ss -lntp | egrep ':(5900|5901)\b' || true
        echo
        echo "=== UDP listener (177) ==="
        ss -lunp | egrep ':(177)\b' || true
      args:
        executable: /bin/bash
      changed_when: false
