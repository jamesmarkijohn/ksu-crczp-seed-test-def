- hosts: ubuntu-host
  become: true
  gather_facts: false

  vars:
    desktop_choice: "gnome"

  tasks:
    - name: Ensure Python & apt binidngs exist
      ansible.builtin.raw: |
        test -e /usr/bin/python3 || (apt-get update -y && apt-get install -y python3)
        apt-get install -y python3-apt
      changed_when: false

    - name: Create ubuntu-user
      ansible.builtin.user:
        name: ubuntu-user
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
        password: "$6$OtcqMID40HCPh8U7$wLC30ns6ZozkW1sZQouh6a6XesOy7nenCbV42PjqGGRWN7W16x7SdVG8qsHmCV1IWT7/8UaqpnSXoUhk4rmpp."

    - name: Allow SSH password auth
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-crczp-guac.conf
        content: |
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
        owner: root
        group: root
        mode: "0644"
      notify: Restart SSH

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
