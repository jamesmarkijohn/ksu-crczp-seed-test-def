---
- name: Ubuntu GUI + VNC for Guacamole (XFCE + TigerVNC)
  hosts: ubuntu-host
  become: true
  vars:
    gui_user: guac
    gui_user_password: "password"
    vnc_password: "password"
    vnc_display: "1"
    vnc_geometry: "1920x1080"
    vnc_depth: "24"
    allow_vnc_nonlocal: true

  tasks:
    - name: Install desktop + VNC packages (XFCE is lighter than GNOME)
      apt:
        update_cache: true
        name:
          - xfce4
          - xfce4-goodies
          - dbus-x11
          - xauth
          - x11-xserver-utils
          - xterm
          - tigervnc-standalone-server
          - tigervnc-common
        state: present

    - name: Create GUI user
      user:
        name: "{{ gui_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: Set GUI user password (for SSH PasswordAuthentication)
      command: bash -lc "echo '{{ gui_user }}:{{ gui_user_password }}' | chpasswd"

    - name: Ensure SSH password auth is enabled (drop-in)
      copy:
        dest: /etc/ssh/sshd_config.d/99-crczp-passwordauth.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication yes

    - name: Restart SSH
      service:
        name: ssh
        state: restarted

    - name: Create ~/.vnc directory
      file:
        path: "/home/{{ gui_user }}/.vnc"
        state: directory
        owner: "{{ gui_user }}"
        group: "{{ gui_user }}"
        mode: "0700"

    - name: Create VNC password file (required or vncserver will fail)
      shell: |
        set -euo pipefail
        printf "%s\n" "{{ vnc_password }}" | vncpasswd -f > "/home/{{ gui_user }}/.vnc/passwd"
        chown "{{ gui_user }}:{{ gui_user }}" "/home/{{ gui_user }}/.vnc/passwd"
        chmod 0600 "/home/{{ gui_user }}/.vnc/passwd"
      args:
        executable: /bin/bash

    - name: Install xstartup to launch XFCE
      copy:
        dest: "/home/{{ gui_user }}/.vnc/xstartup"
        owner: "{{ gui_user }}"
        group: "{{ gui_user }}"
        mode: "0755"
        content: |
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4

    - name: Install systemd unit template for vncserver@.service
      copy:
        dest: /etc/systemd/system/vncserver@.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=TigerVNC server on display :%i
          After=network.target

          [Service]
          Type=forking
          User={{ gui_user }}
          Group={{ gui_user }}
          WorkingDirectory=/home/{{ gui_user }}
          Environment=HOME=/home/{{ gui_user }}
          Environment=USER={{ gui_user }}

          # TigerVNC creates: ~/.vnc/<hostname>:<display>.pid
          PIDFile=/home/{{ gui_user }}/.vnc/{{ ansible_hostname }}:%i.pid

          ExecStartPre=/usr/bin/test -f /home/{{ gui_user }}/.vnc/passwd
          ExecStartPre=-/usr/bin/vncserver -kill :%i
          ExecStart=/usr/bin/vncserver :%i -geometry {{ vnc_geometry }} -depth {{ vnc_depth }} {{ "-localhost no" if allow_vnc_nonlocal else "-localhost yes" }}
          ExecStop=/usr/bin/vncserver -kill :%i

          Restart=on-failure
          RestartSec=2
          TimeoutStartSec=60
          GuessMainPID=yes

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable and start VNC server on :{{ vnc_display }}
      block:
        - systemd:
            daemon_reload: true

        - systemd:
            name: "vncserver@{{ vnc_display }}"
            enabled: true
            state: started

      rescue:
        - name: Dump VNC service status
          shell: |
            set -x
            hostname
            id {{ gui_user }}
            ls -la /home/{{ gui_user }}/.vnc || true
            systemctl status vncserver@{{ vnc_display }} --no-pager -l || true
            journalctl -u vncserver@{{ vnc_display }} --no-pager -n 200 || true
          args:
            executable: /bin/bash

    - name: Ensure system boots into graphical target (optional but fine)
      command: systemctl set-default graphical.target
