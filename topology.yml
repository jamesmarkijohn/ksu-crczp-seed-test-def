name: seed-netsec-packet-sniffing-spoofing

hosts:
  - name: attacker
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu
  - name: hostA
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu
  - name: hostB
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

routers:
  - name: r1
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

networks:
  - name: lab-net
    cidr: 10.9.0.0/24
    accessible_by_user: true

net_mappings:
  - host: attacker
    network: lab-net
    ip: 10.9.0.1
  - host: hostA
    network: lab-net
    ip: 10.9.0.5
  - host: hostB
    network: lab-net
    ip: 10.9.0.6

router_mappings:
  - router: r1
    network: lab-net
    ip: 10.9.0.254

groups:
  - name: ubuntu-hosts
    nodes:
      - attacker
      - hostA
      - hostB
