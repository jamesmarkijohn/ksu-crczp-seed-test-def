name: seed-gui-test

routers:
  - name: r1
    flavor: standard.small
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian

networks:
  - name: user-net
    cidr: 10.10.10.0/24
    accessible_by_user: true

hosts:
  - name: ubuntu-host
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

router_mappings:
  - router: r1
    network: user-net
    ip: 10.10.10.1

net_mappings:
  - host: ubuntu-host
    network: user-net
    ip: 10.10.10.10

groups:
  - name: ubuntu_desktop
    nodes:
      - ubuntu-host
