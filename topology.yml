name: seed-gui-test

hosts:
  - name: ubuntu-host
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

routers:
  - name: r1
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

wan:
  name: seed-test-1-wan
  cidr: 100.100.100.0/24

networks:
  - name: net1
    cidr: 10.10.0.0/24
    accessible_by_user: true

net_mappings:
  - host: ubuntu-host
    network: net1
    ip: 10.10.0.10

router_mappings:
  - router: r1
    network: net1
    ip: 10.10.0.1

groups:
  - name: all-nodes
    nodes:
      - ubuntu-host
      - r1
