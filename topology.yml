name: ubuntu-20-04-seed-labs

hosts:
  - name: ubuntu-host
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

routers:
  - name: r1
    flavor: standard.small
    base_box:
      image: ubuntu-20.04-server-cloudimg-amd64
      mgmt_user: ubuntu

networks:
  - name: user-net
    cidr: 10.10.10.0/24
    accessible_by_user: true

net_mappings:
  - host: ubuntu-host
    network: user-net
    ip: 10.10.10.10

router_mappings:
  - router: r1
    network: user-net
    ip: 10.10.10.1

groups:
  - name: ubuntu-desktop
    nodes:
      - ubuntu-host
